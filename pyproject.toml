[tool.mypy]
# This block tells MyPy to be very strict (which 42 loves)
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

[tool.flake8]
# Flake8 settings (some plugins read this, or use a separate .flake8 file)
max-line-length = 88
extend-ignore = "E203"